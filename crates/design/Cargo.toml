[package]
name = "design"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Require human approval of an agent draft before task decomposition.
[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
webauth = { workspace = true, optional = true }
delivery = { workspace = true, optional = true }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"], optional = true }

[features]
pg = ["dep:sqlx"]
http = ["dep:axum", "dep:serde", "dep:webauth", "webauth/http"]
# Draft through delivery::AgentExecutor using local or remote agents.
agent = ["dep:delivery"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
