[package]
name = "probe"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Protocol-neutral request, outcome, and assertion types with a plugin registry.
# Features select available protocols; assertions apply to both inputs and outputs.
[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Feature-gated plugin dependencies.
api-runner = { workspace = true, optional = true }
tonic = { version = "0.12", optional = true }
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
prost = { version = "0.13", optional = true }
prost-reflect = { version = "0.14.7", features = ["serde"], optional = true }
protox = { version = "0.7.2", optional = true }
base64 = { version = "0.22", optional = true }
url = { version = "2", optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
tower = { workspace = true, features = ["util"], optional = true }

# Enable PostgreSQL and MySQL drivers separately.
sqlx = { workspace = true, features = ["runtime-tokio"], optional = true }
# Async Redis client with multiplexed connections.
redis = { workspace = true, features = ["tokio-comp"], optional = true }
# Pure Rust WebSocket client with connect and handshake support.
tokio-tungstenite = { version = "0.24", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"], optional = true }
tokio = { workspace = true, features = ["time", "net"], optional = true }
# SSH uses host:port targets, command payloads, and metadata credentials.
russh = { version = "0.62", optional = true }

[features]
default = ["http"]
database-results = ["dep:tokio", "dep:futures-util", "sqlx/json", "sqlx/chrono", "sqlx/uuid", "sqlx/bigdecimal"]
http = ["dep:api-runner"]
grpc = ["dep:tonic", "dep:bytes", "dep:http"]
grpc-dynamic = ["grpc", "dep:prost", "dep:prost-reflect", "dep:protox", "dep:base64", "dep:url", "dep:hyper-util", "dep:tower", "dep:tokio", "tonic/tls", "tonic/tls-webpki-roots"]
sql = ["dep:sqlx", "sqlx/postgres", "database-results"]
mysql = ["dep:sqlx", "sqlx/mysql", "database-results"]
redis = ["dep:redis", "dep:tokio", "redis/tokio-rustls-comp", "redis/tls-rustls-webpki-roots"]
websocket = ["dep:tokio-tungstenite", "dep:futures-util", "dep:tokio"]
ssh = ["dep:russh", "dep:tokio"]

[dev-dependencies]
rcgen = "0.13"
prost-types = "0.13"
tokio-stream = { version = "0.1", features = ["net"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
# Exercise connect, send, receive, and assertions against a local echo server.
tokio-tungstenite = "0.24"
futures-util = "0.3"

[lints]
workspace = true
