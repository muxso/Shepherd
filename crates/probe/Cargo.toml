[package]
name = "probe"
edition.workspace = true
version.workspace = true
license.workspace = true

# 协议探测插件系统:协议无关的请求/结果/断言(domain,纯函数)+ ProtocolPlugin 端口 + 注册表。
# 每种协议是一个 feature 门控的插件(http 默认;grpc/sql 等按需);
# runner 按启用的 feature 决定支持哪些协议 —— 不同部署支持不同系统。断言对输入输出生效。
[dependencies]
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 插件依赖(feature 门控)
api-runner = { path = "../api-runner", optional = true }
tonic = { version = "0.12", optional = true }
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
# SQL 驱动按需启用:sql→postgres、mysql→mysql(同一 sqlx 依赖,feature 加驱动)。
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio"], optional = true }
# Redis 协议:纯 Rust 客户端(无 C 依赖),tokio 异步多路复用连接。
redis = { version = "0.27", default-features = false, features = ["tokio-comp"], optional = true }
# WebSocket 协议:纯 Rust(tokio-tungstenite,默认 connect+handshake,无 TLS C 依赖;支持 ws://)。
tokio-tungstenite = { version = "0.24", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"], optional = true }
tokio = { version = "1", default-features = false, features = ["time"], optional = true }

[features]
default = ["http"]
http = ["dep:api-runner"]
grpc = ["dep:tonic", "dep:bytes", "dep:http"]
sql = ["dep:sqlx", "sqlx/postgres"]
mysql = ["dep:sqlx", "sqlx/mysql"]
redis = ["dep:redis"]
websocket = ["dep:tokio-tungstenite", "dep:futures-util", "dep:tokio"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
# websocket e2e:测试内起一个本地 echo 服务,验证插件 连接→发送→收回→断言。
tokio-tungstenite = "0.24"
futures-util = "0.3"

[lints]
workspace = true
