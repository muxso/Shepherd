[package]
name = "mock-runtime"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Match requests against mock rules in the pure domain engine.
# The HTTP adapter translates requests and responses.
[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time"], optional = true }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"], optional = true }
minijinja = { version = "2", optional = true }
uuid = { workspace = true, optional = true }
fake = { version = "2", optional = true }

[features]
http = ["dep:axum", "dep:tokio"]
pg = ["dep:sqlx"]
# Response templates expose request context and dynamic helper functions.
template = ["dep:minijinja", "dep:uuid", "dep:fake"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
axum = { workspace = true }

[lints]
workspace = true
