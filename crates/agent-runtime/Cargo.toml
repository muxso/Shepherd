[package]
name = "agent-runtime"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Agent runtime: claim outbound work, run a CLI, and stream results.
# Implementation mode publishes Git snapshots; design mode publishes Markdown.
[[bin]]
name = "agent-runtime"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "time", "signal", "sync"] }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
anyhow = "1"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Signal the whole process group on timeout or shutdown to reap child processes.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Use a paused clock for retry backoff tests.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
