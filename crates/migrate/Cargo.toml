[package]
name = "migrate"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Versioned migrations for the main database; plugins migrate their own databases.
# SQLx serializes concurrent migration runs with a PostgreSQL advisory lock.
[dependencies]
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "migrate", "macros"] }

