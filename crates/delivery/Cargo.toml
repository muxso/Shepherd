[package]
name = "delivery"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Shepherd 交付上下文:把任务派发给 AI 执行者(Claude Code / Codex)并记录交付尝试。
# 复用 api-test 的"出站端口 + DispatchOutcome(异步 Accepted / 同步 Completed)"模式:
# `AgentExecutor` 端口背后两种适配器并存 —— 本地子进程(exec-local)与 Agent HTTP API(exec-http),
# 由组装根按环境/任务路由。领域/应用不感知具体执行器。
[dependencies]
kernel = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"], optional = true }
axum = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"], optional = true }
redis = { workspace = true, features = ["tokio-comp", "streams"], optional = true }
tokio = { workspace = true, features = ["process", "io-util", "macros", "time"], optional = true }
webauth = { workspace = true, optional = true }

[features]
pg = ["dep:sqlx"]
http = ["dep:axum", "dep:serde", "dep:webauth", "webauth/http", "dep:utoipa"]
# 真实执行器适配器(可选):
exec-http = ["dep:reqwest", "dep:serde", "dep:serde_json"]   # 对接 Agent SDK/API(远端,异步)
exec-local = ["dep:tokio", "dep:serde", "dep:serde_json"]    # 本地 spawn claude/codex headless(同步)
exec-queue = ["http", "dep:tokio"]                           # 执行者机群:派发入队 + runtime 长轮询认领(远端 pull)
exec-queue-redis = ["exec-queue", "dep:redis", "dep:serde_json"]  # 分布式队列:Redis Streams 消费组(多副本+多 runtime)

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "io-util", "net"] }
tower = { workspace = true, features = ["util"] }
serde_json = { workspace = true }
axum = { workspace = true }
migrate = { workspace = true }
webauth = { workspace = true, features = ["http", "test-util"] }

[lints]
workspace = true
