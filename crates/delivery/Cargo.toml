[package]
name = "delivery"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Dispatch tasks through AgentExecutor and record delivery attempts.
# The composition root chooses local, HTTP, or queued execution.
[dependencies]
kernel = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"], optional = true }
axum = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"], optional = true }
redis = { workspace = true, features = ["tokio-comp", "streams"], optional = true }
tokio = { workspace = true, features = ["process", "io-util", "macros", "time"], optional = true }
webauth = { workspace = true, optional = true }

[features]
pg = ["dep:sqlx"]
http = ["dep:axum", "dep:serde", "dep:webauth", "webauth/http", "dep:utoipa"]
# Optional executor adapters.
exec-http = ["dep:reqwest", "dep:serde", "dep:serde_json"]   # Remote Agent SDK/API (async)
exec-local = ["dep:tokio", "dep:serde", "dep:serde_json"]    # Local headless CLI (sync)
exec-queue = ["http", "dep:tokio"]                           # Queue dispatch with runtime long polling
exec-queue-redis = ["exec-queue", "dep:redis", "dep:serde_json"]  # Redis Streams consumer groups for multiple replicas

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "io-util", "net"] }
tower = { workspace = true, features = ["util"] }
serde_json = { workspace = true }
axum = { workspace = true }
migrate = { workspace = true }
webauth = { workspace = true, features = ["http", "test-util"] }

[lints]
workspace = true
