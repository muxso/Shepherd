[package]
name = "server"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# 组装根(composition root)= Java 版 backend/app。
# 唯一允许同时认识具体存储(PG)、HTTP(axum)、各模块用例的地方:
# 把它们 new 出来、合并路由、启动。其余各层永远只认抽象。
[dependencies]
system-setting = { path = "../system-setting", features = ["pg", "http", "auth", "oidc", "ldap"] }
rag = { path = "../rag", features = ["http"] }
project = { path = "../project", features = ["pg", "http"] }
case = { path = "../case", features = ["pg", "http"] }
bug = { path = "../bug", features = ["pg", "http"] }
comment = { path = "../comment", features = ["pg", "http"] }
follow = { path = "../follow", features = ["pg", "http"] }
notice = { workspace = true, features = ["pg", "http", "robot"] }
test-plan = { path = "../test-plan", features = ["pg", "http"] }
requirement = { path = "../requirement", features = ["pg", "http"] }
task = { path = "../task", features = ["pg", "http"] }
delivery = { workspace = true, features = ["pg", "http", "exec-http", "exec-local", "exec-queue", "exec-queue-redis"] }
design = { path = "../design", features = ["pg", "http", "agent"] }
verification = { path = "../verification", features = ["pg", "http"] }
skill = { path = "../skill", features = ["pg", "http"] }
orchestrator = { path = "../orchestrator" }
mcp = { path = "../mcp" }
webauth = { workspace = true, features = ["http"] }
async-trait = { workspace = true }
serde = { workspace = true }
utoipa = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
api-test = { path = "../api-test", features = ["pg", "http", "jmeter", "local", "parquet-archive"] }
api-runner = { workspace = true }
api-definition = { path = "../api-definition", features = ["pg", "http"] }
api-scenario = { path = "../api-scenario", features = ["pg", "http"] }
environment = { path = "../environment", features = ["pg", "http"] }
case-management = { path = "../case-management", features = ["pg", "http"] }
runner = { path = "../runner", features = ["pg", "http", "client"] }
pool-runner = { path = "../pool-runner" }
mock-runtime = { path = "../mock-runtime", features = ["http", "pg", "template"] }
# 压测统一经 probe 注册表(probe-exec)驱动任意协议;probe 提供 http/grpc/sql 插件类型与默认注册表。
perf = { path = "../perf", features = ["engine", "pg", "parquet-sink", "probe-exec"] }
probe = { workspace = true, default-features = true, features = ["http", "grpc", "sql", "mysql", "redis", "websocket", "ssh"] }
migrate = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"] }
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["time", "sync"] }
tokio-cron-scheduler = "0.13"
base64 = "0.22"
tower = { workspace = true }
tower-http = { version = "0.6", features = ["trace", "timeout", "limit", "cors"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
