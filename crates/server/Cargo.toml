[package]
name = "server"
edition.workspace = true
version.workspace = true
license.workspace = true

# 组装根(composition root)= Java 版 backend/app。
# 唯一允许同时认识具体存储(PG)、HTTP(axum)、各模块用例的地方:
# 把它们 new 出来、合并路由、启动。其余各层永远只认抽象。
[dependencies]
system-setting = { path = "../system-setting", features = ["pg", "http", "auth", "oidc"] }
project = { path = "../project", features = ["pg", "http"] }
case = { path = "../case", features = ["pg", "http"] }
bug = { path = "../bug", features = ["pg", "http"] }
test-plan = { path = "../test-plan", features = ["pg", "http"] }
requirement = { path = "../requirement", features = ["pg", "http"] }
task = { path = "../task", features = ["pg", "http"] }
delivery = { path = "../delivery", features = ["pg", "http", "exec-http", "exec-local"] }
verification = { path = "../verification", features = ["pg", "http"] }
skill = { path = "../skill", features = ["pg", "http"] }
orchestrator = { path = "../orchestrator" }
mcp = { path = "../mcp" }
webauth = { path = "../webauth", features = ["http"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
api-test = { path = "../api-test", features = ["pg", "http", "jmeter", "local"] }
migrate = { path = "../migrate" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
