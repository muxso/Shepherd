[package]
name = "mcp"
edition.workspace = true
version.workspace = true
license.workspace = true

# Model Context Protocol 服务端引擎(协议层,零业务知识):JSON-RPC 2.0 + initialize/tools.list/
# tools.call + 通用工具注册表。业务工具由组装根注册(桥接到各上下文服务)。
[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
