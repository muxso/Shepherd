[package]
name = "verification"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Shepherd 完整性验证上下文:需求 ←→ 任务 ←→ 实现 双向追溯 + 缺口检测。
# 一个需求版本一个 Verification 聚合,持有验收标准 + 覆盖链(criterion ↔ task)。
# 把"每条验收标准是否被已交付且验证的任务覆盖"聚合成确定性的完整性报告(复用 case-review 的聚合精神)。
# 通过 requirement_id/version + decomposition_id/task_id(字符串)引用其它上下文,无类型耦合。
[dependencies]
kernel = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"], optional = true }
axum = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
webauth = { workspace = true, optional = true }

[features]
pg = ["dep:sqlx"]
http = ["dep:axum", "dep:serde", "dep:webauth", "webauth/http", "dep:utoipa"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
serde_json = { workspace = true }
migrate = { workspace = true }
webauth = { workspace = true, features = ["http", "test-util"] }

[lints]
workspace = true
