[package]
name = "pool-runner"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Resource-pool remote runner. The lib holds the WS wire protocol (shared with
# the server) plus the executor loop that replays a compiled scenario plan via
# api-test's PlanExecutor and streams step events back. The bin dials out to the
# server (runners have no public network), so all traffic rides one outbound WS.
[dependencies]
api-runner = { workspace = true }
api-test = { path = "../api-test", features = ["local"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
