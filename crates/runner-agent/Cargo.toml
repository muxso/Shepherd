[package]
name = "runner-agent"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Run self-contained requests inside the target environment without the central database.
[[bin]]
name = "runner-agent"
path = "src/main.rs"

[dependencies]
api-runner = { workspace = true }
# Features select supported protocols; use --no-default-features for a minimal agent.
probe = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["http", "grpc", "sql", "mysql", "redis", "websocket"]
http = ["probe/http"]
grpc = ["probe/grpc"]
sql = ["probe/sql"]
mysql = ["probe/mysql"]
redis = ["probe/redis"]
websocket = ["probe/websocket"]

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
