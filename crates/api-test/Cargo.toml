[package]
name = "api-test"
edition.workspace = true
version.workspace = true
license.workspace = true

# 接口测试上下文。核心(domain/ports/application)纯净;多种执行器适配器 feature 门控:
#   local  —— 原生 Rust runner(api-runner)就地跑
#   jmeter —— HTTP 下发 JMeter 节点
#   pg     —— PG 资源池/报告/用例规格(含 per-case 结果),依赖 local 的 trait
#   http   —— axum 入口
[dependencies]
async-trait = "0.1"
thiserror = "2"
api-runner = { path = "../api-runner", optional = true }
futures = { version = "0.3", optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json"], optional = true }
serde_json = { version = "1", optional = true }
axum = { version = "0.8", optional = true }
utoipa = { version = "5", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[features]
local = ["dep:api-runner", "dep:futures"]
pg = ["dep:sqlx", "dep:serde_json", "local"]
http = ["dep:axum", "dep:serde", "dep:utoipa"]
jmeter = ["dep:reqwest", "dep:serde"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
migrate = { path = "../migrate" }

[lints]
workspace = true
