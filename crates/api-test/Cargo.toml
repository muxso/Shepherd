[package]
name = "api-test"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# 接口测试上下文。核心(domain/ports/application)纯净;多种执行器适配器 feature 门控:
#   local  —— 原生 Rust runner(api-runner)就地跑
#   jmeter —— HTTP 下发 JMeter 节点
#   pg     —— PG 资源池/报告/用例规格(含 per-case 结果),依赖 local 的 trait
#   http   —— axum 入口
[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
# kernel/serde_json 属核心:用例执行记录读模型(CaseExecutionRecord)的分页与 failures(JSONB)
# 都落在纯核心层(ports/application),故非 feature 门控。serde_json::Value 不属 IO,架构守卫放行。
kernel = { workspace = true }
serde_json = { workspace = true }
api-runner = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
# 串行执行 WAIT 处理器需要 sleep;只在 local 执行器启用。
tokio = { workspace = true, features = ["time"], optional = true }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "json"], optional = true }
axum = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
webauth = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"], optional = true }
# Parquet 报告归档(object_store:本地/内存/S3);与 perf 的 parquet-sink 同版本。
arrow = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }

[features]
local = ["dep:api-runner", "dep:futures", "dep:tokio"]
pg = ["dep:sqlx", "local"]
http = ["dep:axum", "dep:serde", "dep:utoipa", "dep:webauth", "webauth/http"]
jmeter = ["dep:reqwest", "dep:serde"]
# 已完成报告导出 Parquet 冷存储(读模型来自 pg)。
parquet-archive = ["pg", "dep:arrow", "dep:parquet", "dep:object_store"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
serde_json = { workspace = true }
migrate = { workspace = true }
webauth = { workspace = true, features = ["http", "test-util"] }

[lints]
workspace = true
