[package]
name = "api-test"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# API testing with feature-gated local, JMeter, PostgreSQL, and HTTP adapters.
[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
# Execution read models use serde_json in the core; it has no IO dependency.
kernel = { workspace = true }
serde_json = { workspace = true }
api-runner = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
# Sequential WAIT processors need sleep only in the local executor.
tokio = { workspace = true, features = ["time"], optional = true }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "json"], optional = true }
axum = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
webauth = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"], optional = true }
# Keep Parquet archive dependencies aligned with perf.
arrow = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }

[features]
local = ["dep:api-runner", "dep:futures", "dep:tokio"]
pg = ["dep:sqlx", "local"]
http = ["dep:axum", "dep:serde", "dep:utoipa", "dep:webauth", "webauth/http"]
jmeter = ["dep:reqwest", "dep:serde"]
# Export completed reports from PostgreSQL to Parquet.
parquet-archive = ["pg", "dep:arrow", "dep:parquet", "dep:object_store"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
serde_json = { workspace = true }
migrate = { workspace = true }
webauth = { workspace = true, features = ["http", "test-util"] }

[lints]
workspace = true
