[package]
name = "perf"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Aggregate throughput, errors, and latency percentiles in the domain.
# The async engine executes load plans through RequestExecutor and the probe registry.
[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"], optional = true }
api-runner = { workspace = true, optional = true }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "json"], optional = true }
serde_json = { workspace = true, optional = true }
# Archive samples to Parquet and object storage without native compression libraries.
arrow = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
# Use the probe registry for protocol execution and assertions.
probe = { workspace = true, optional = true }

[features]
engine = ["dep:tokio"]
api-runner-exec = ["dep:api-runner"]
pg = ["dep:sqlx", "dep:serde_json"]
# Enable all supported protocols through one executor.
probe-exec = ["dep:probe", "probe/http", "probe/grpc", "probe/sql", "probe/mysql", "probe/redis", "probe/websocket"]
# Parquet sample storage supports local, memory, and S3 backends.
parquet-sink = ["dep:arrow", "dep:parquet", "dep:object_store"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }
axum = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
