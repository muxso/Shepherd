[package]
name = "perf"
edition.workspace = true
version.workspace = true
license.workspace = true

# 原生 Rust 压测引擎(替代 JMeter 的压测层)。
# 核心是零 IO 的统计聚合(domain):给定一批 (延迟, 成败) 样本 + 总耗时 → 吞吐/错误率/延迟分位。
# engine(tokio)按负载计划并发跑,经 RequestExecutor 端口执行单次请求;
# 多协议压测统一经 probe-exec(probe 注册表)驱动 —— 加协议=加 probe 插件,不必再写 bespoke 执行器。
[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros", "time"], optional = true }
api-runner = { path = "../api-runner", optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json"], optional = true }
serde_json = { version = "1", optional = true }
# 样本下沉到 Parquet + 对象存储(列存冷/分析层)。压缩用 UNCOMPRESSED,纯 Rust 无 C 依赖。
arrow = { version = "53", optional = true }
parquet = { version = "53", default-features = false, features = ["arrow"], optional = true }
object_store = { version = "0.11", optional = true }
# 协议插件注册表:让压测引擎经一个执行器驱动任意协议(http/grpc/sql/…),带统一断言。
probe = { path = "../probe", default-features = false, optional = true }

[features]
engine = ["dep:tokio"]
api-runner-exec = ["dep:api-runner"]
pg = ["dep:sqlx", "dep:serde_json"]
# 统一执行器:压测经 probe 注册表驱动任意协议(http/grpc/sql/redis 插件全启)。
probe-exec = ["dep:probe", "probe/http", "probe/grpc", "probe/sql", "probe/redis"]
# Parquet 样本下沉(object_store:本地/内存/S3)。
parquet-sink = ["dep:arrow", "dep:parquet", "dep:object_store"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
axum = "0.8"
serde_json = "1"

[lints]
workspace = true
