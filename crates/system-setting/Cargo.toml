[package]
name = "system-setting"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Keep the core IO-free; load optional adapter dependencies through features.
[dependencies]
kernel = { workspace = true }
webauth = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
# Optional IO adapters.
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"], optional = true }
axum = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
# Password hashing.
argon2 = { version = "0.5", optional = true }
# OIDC authentication.
reqwest = { workspace = true, features = ["json", "rustls-tls"], optional = true }
serde_json = { workspace = true, optional = true }
# Random OIDC state tokens for CSRF protection.
uuid = { workspace = true, optional = true }
# LDAP authentication with rustls.
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"], optional = true }

[features]
pg = ["dep:sqlx"]
http = ["dep:axum", "dep:serde", "webauth/http", "dep:utoipa", "dep:uuid"]
auth = ["dep:argon2"]
oidc = ["dep:reqwest", "dep:serde", "dep:serde_json"]
ldap = ["dep:ldap3"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
tower = { workspace = true, features = ["util"] }
serde_json = { workspace = true }
axum = { workspace = true }
migrate = { workspace = true }

[lints]
workspace = true
