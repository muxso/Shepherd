[package]
name = "requirement"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Shepherd 需求管理上下文:需求聚合 + 线性多版本快照 + baseline 指针。
# 沿用六边形分层(domain/ports/application/adapters)+ feature 门控的 IO 适配器(pg/http)。
[dependencies]
kernel = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"], optional = true }
axum = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
webauth = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

[features]
pg = ["dep:sqlx"]
http = ["dep:axum", "dep:serde", "dep:webauth", "webauth/http", "dep:utoipa"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
serde_json = { workspace = true }
migrate = { workspace = true }
webauth = { workspace = true, features = ["http", "test-util"] }

[lints]
workspace = true
