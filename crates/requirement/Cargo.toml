[package]
name = "requirement"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# Shepherd 需求管理上下文:需求聚合 + 线性多版本快照 + baseline 指针。
# 沿用六边形分层(domain/ports/application/adapters)+ feature 门控的 IO 适配器(pg/http)。
[dependencies]
kernel = { path = "../kernel" }
async-trait = "0.1"
thiserror = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"], optional = true }
axum = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
webauth = { path = "../webauth", optional = true }
utoipa = { version = "5", optional = true }

[features]
pg = ["dep:sqlx"]
http = ["dep:axum", "dep:serde", "dep:webauth", "webauth/http", "dep:utoipa"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
migrate = { path = "../migrate" }
webauth = { path = "../webauth", features = ["http", "test-util"] }

[lints]
workspace = true
