[package]
name = "case-management"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# 功能用例管理:用例 CRUD + 自定义字段(jsonb)+ Excel 导出。
# domain/ports/application 纯净;sqlx/axum/xlsx 只在 adapters,feature 门控。
[dependencies]
kernel = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "json"], optional = true }
axum = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
webauth = { workspace = true, optional = true }
serde = { workspace = true }
rust_xlsxwriter = { version = "0.79", optional = true }
# calamine 0.36 (quick-xml 0.41) needs Rust 1.88; 0.35 is the newest for our 1.86 pin.
calamine = { version = "0.35", optional = true }

[features]
pg = ["dep:sqlx"]
http = ["dep:axum", "dep:webauth", "webauth/http", "dep:utoipa", "dep:rust_xlsxwriter", "dep:calamine"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
serde_json = { workspace = true }
migrate = { workspace = true }
webauth = { workspace = true, features = ["http", "test-util"] }

[lints]
workspace = true
