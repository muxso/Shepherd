[package]
name = "runner"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Register environment agents, dispatch self-contained cases, and collect results.
# Storage, HTTP dispatch, and routes live in feature-gated adapters.
[dependencies]
kernel = { workspace = true }
api-runner = { workspace = true }
# Use protocol-neutral probe types without IO plugins.
probe = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"], optional = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"], optional = true }
axum = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
webauth = { workspace = true, optional = true }

[features]
pg = ["dep:sqlx"]
client = ["dep:reqwest"]
http = ["dep:axum", "dep:utoipa", "dep:webauth", "webauth/http", "client"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
migrate = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"] }
webauth = { workspace = true, features = ["http", "test-util"] }

[lints]
workspace = true
