# Shepherd single-host dev/demo stack.
#
# Usage:
#   cp deploy/docker/.env.example deploy/docker/.env   # then edit the secrets
#   docker compose -f deploy/docker/docker-compose.yml up --build
#
# Secrets live in deploy/docker/.env (gitignored); compose interpolates them
# at the ${VAR:?} references below and fails fast when the file is missing.
# With legacy docker-compose v1, run from deploy/docker/ (it reads .env from
# the current directory) or pass --project-directory deploy/docker.
#
# URLs:    web  http://localhost:8082    api  http://localhost:8182
# Login:   admin / $SHEPHERD_ADMIN_PASSWORD
#
# This is NOT a production deployment — PG/Redis run locally. For prod, use
# deploy/helm or deploy/terraform.

name: shepherd

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shepherd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/docker/.env}
      POSTGRES_DB: shepherd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shepherd -d shepherd"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in deploy/docker/.env}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in deploy/docker/.env}
    restart: unless-stopped

  server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
    environment:
      DATABASE_URL: postgres://shepherd:${POSTGRES_PASSWORD:?set in deploy/docker/.env}@postgres:5432/shepherd
      SHEPHERD_BIND: 0.0.0.0:8088
      SHEPHERD_ADMIN_PASSWORD: ${SHEPHERD_ADMIN_PASSWORD:?set in deploy/docker/.env}
      SHEPHERD_AGENT_FLEET: "1"
      SHEPHERD_FLEET_REDIS: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "8182:8088"
    networks:
      default:
        # nginx (web) and the Helm chart both address the server as `shepherd-server`.
        aliases:
          - shepherd-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  agent-runtime:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.agent-runtime
    environment:
      SHEPHERD_BASE: http://server:8088
      # API key is the only runtime credential. Issue one after first boot
      # (web: 个人中心 → API KEY, or POST /system/apikey), put it in .env,
      # then `docker compose up -d agent-runtime`.
      SHEPHERD_AGENT_KEY: ${SHEPHERD_AGENT_KEY:?issue via POST /system/apikey and set in deploy/docker/.env}
      AGENT_MOCK: "1"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    ports:
      - "8082:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
