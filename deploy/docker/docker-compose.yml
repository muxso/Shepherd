# Shepherd single-host dev/demo stack.
#
# Usage:
#   docker compose -f deploy/docker/docker-compose.yml up --build
#
# URLs:    web  http://localhost:8080    api  http://localhost:8088
# Login:   admin / change-me-please   (SHEPHERD_ADMIN_PASSWORD below)
#
# This is NOT a production deployment — secrets are inline and PG/Redis run
# locally. For prod, use deploy/helm or deploy/terraform.

name: shepherd

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shepherd
      POSTGRES_PASSWORD: shepherd
      POSTGRES_DB: shepherd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shepherd -d shepherd"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
    environment:
      DATABASE_URL: postgres://shepherd:shepherd@postgres:5432/shepherd
      SHEPHERD_BIND: 0.0.0.0:8088
      SHEPHERD_ADMIN_PASSWORD: change-me-please
      SHEPHERD_AGENT_FLEET: "1"
      SHEPHERD_FLEET_REDIS: redis://redis:6379
    ports:
      - "8088:8088"
    networks:
      default:
        # nginx (web) and the Helm chart both address the server as `shepherd-server`.
        aliases:
          - shepherd-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  agent-runtime:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.agent-runtime
    environment:
      SHEPHERD_BASE: http://server:8088
      SHEPHERD_ADMIN_USER: admin
      SHEPHERD_ADMIN_PASSWORD: change-me-please
      AGENT_MOCK: "1"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
