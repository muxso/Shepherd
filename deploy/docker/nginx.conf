# Canonical nginx config for shepherd-web.
# Serves the SPA and reverse-proxies backend prefixes to the Rust server.
# Backend prefixes are disambiguated by the Accept header: browser navigations
# (Accept: text/html) fall through to the SPA; everything else (XHR/fetch/API
# clients) is proxied to shepherd-server.

upstream shepherd_server {
    server shepherd-server:8088;
}

map $http_accept $shepherd_wants_html {
    default          0;
    "~*text/html"    1;
}

# Pass WebSocket upgrades through (/api/pool-runner/ws, /api/run-events/ws);
# plain requests keep an empty Connection header for upstream keepalive.
map $http_upgrade $shepherd_connection {
    default "";
    "~."    "upgrade";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend prefixes (kept in sync with the deploy contract).
    location ~ ^/(api|auth|project|organization|system|role|user-role|requirement|decomposition|delivery|verification|skill|bug|functional-case|test-plan|perf|runner|runner-agent|case-review|mcp|agent|notice|follow|comment|template|me|prd-draft)(/|$) {
        # Browser navigations to these paths still get the SPA shell.
        if ($shepherd_wants_html) {
            rewrite ^ /index.html last;
        }

        proxy_pass http://shepherd_server;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $shepherd_connection;
        proxy_read_timeout 300s;
    }

    # Backend-owned pages/endpoints: no SPA fallback even for text/html
    # (swagger-ui is an HTML page served by the backend itself).
    location ~ ^/(healthz|api-docs|swagger-ui)(/|$) {
        proxy_pass http://shepherd_server;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # SPA: serve static assets, fall back to index.html for client-side routes.
    location / {
        try_files $uri /index.html;
    }
}
