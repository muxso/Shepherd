{{- if .Values.server.ingress.enabled -}}
{{- $component := "server" -}}
{{- $ctx := dict "root" . "component" $component -}}
{{- $ing := .Values.server.ingress -}}
{{- $svc := include "shepherd.serverServiceName" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "shepherd.componentName" $ctx }}
  labels:
    {{- include "shepherd.componentLabels" $ctx | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $ing.className }}
  ingressClassName: {{ $ing.className }}
  {{- end }}
  {{- if $ing.tls }}
  tls:
    - hosts:
        - {{ $ing.host | quote }}
      secretName: {{ include "shepherd.componentName" $ctx }}-tls
  {{- end }}
  rules:
    - host: {{ $ing.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $svc }}
                port:
                  number: {{ .Values.server.service.port }}
{{- end }}
