{{- /*
Shared Secret. Holds only sensitive env that is actually set; OIDC keys are
emitted only when configured so the secret stays minimal.
*/ -}}
{{- $dbUrl := include "shepherd.databaseUrl" . -}}
{{- $redisUrl := include "shepherd.redisUrl" . -}}
{{- $oidc := .Values.config.oidc -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shepherd.secretName" . }}
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $dbUrl }}
  DATABASE_URL: {{ $dbUrl | quote }}
  {{- end }}
  {{- if .Values.config.adminPassword }}
  SHEPHERD_ADMIN_PASSWORD: {{ .Values.config.adminPassword | quote }}
  {{- end }}
  {{- if .Values.config.agentKey }}
  SHEPHERD_AGENT_KEY: {{ .Values.config.agentKey | quote }}
  {{- end }}
  {{- if and .Values.config.fleet.enabled $redisUrl }}
  SHEPHERD_FLEET_REDIS: {{ $redisUrl | quote }}
  {{- end }}
  {{- with $oidc.feishu }}
  {{- if .appId }}
  SHEPHERD_FEISHU_APP_ID: {{ .appId | quote }}
  {{- end }}
  {{- if .appSecret }}
  SHEPHERD_FEISHU_APP_SECRET: {{ .appSecret | quote }}
  {{- end }}
  {{- if .redirect }}
  SHEPHERD_FEISHU_REDIRECT: {{ .redirect | quote }}
  {{- end }}
  {{- end }}
  {{- with $oidc.wecom }}
  {{- if .corpId }}
  SHEPHERD_WECOM_CORP_ID: {{ .corpId | quote }}
  {{- end }}
  {{- if .secret }}
  SHEPHERD_WECOM_SECRET: {{ .secret | quote }}
  {{- end }}
  {{- if .redirect }}
  SHEPHERD_WECOM_REDIRECT: {{ .redirect | quote }}
  {{- end }}
  {{- end }}
