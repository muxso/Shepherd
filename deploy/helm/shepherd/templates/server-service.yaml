{{- $component := "server" -}}
{{- $ctx := dict "root" . "component" $component -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shepherd.serverServiceName" . }}
  labels:
    {{- include "shepherd.componentLabels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "shepherd.componentSelectorLabels" $ctx | nindent 4 }}
