[workspace]
resolver = "2"
# Default binary: crates/server/src/main.rs.
# Run it from the workspace root with cargo run.
default-members = ["crates/server"]
members = [
    "crates/kernel",
    "crates/webauth",
    "crates/system-setting",
    "crates/server",
    "crates/project",
    "crates/case",
    "crates/bug",
    "crates/comment",
    "crates/test-plan",
    "crates/migrate",
    "crates/api-runner",
    "crates/api-test",
    "crates/requirement",
    "crates/task",
    "crates/delivery",
    "crates/design",
    "crates/agent-runtime",
    "crates/verification",
    "crates/orchestrator",
    "crates/mcp",
    "crates/skill",
    "crates/api-definition",
    "crates/api-scenario",
    "crates/environment",
    "crates/plugin-runtime",
    "crates/perf",
    "crates/case-management",
    "crates/runner-agent",
    "crates/runner",
    "crates/pool-runner",
    "crates/probe",
    "crates/shepherd-cli",
    "crates/follow",
    "crates/notice",
    "crates/rag",
    "plugins/yunxiao/backend",
    "plugins/environment/backend",
]

# Shared versions and lints.
# Keep IO dependencies in adapters; domain and application layers remain IO-free.
[workspace.package]
edition = "2021"
version = "0.0.4"
license = "GPL-2.0"
# Members inherit the workspace MSRV.
rust-version = "1.88"
# Internal crate names may overlap crates.io packages; do not publish workspace crates.
publish = false

# Centralize dependencies shared by multiple members.
# Set shared features here only when all consumers need them.
[workspace.dependencies]
# Shared internal dependencies.
kernel = { path = "crates/kernel" }
webauth = { path = "crates/webauth" }
migrate = { path = "crates/migrate" }
api-runner = { path = "crates/api-runner" }
delivery = { path = "crates/delivery" }
notice = { path = "crates/notice" }
rag = { path = "crates/rag" }
# Most consumers need only probe types; the server enables default plugins.
probe = { path = "crates/probe", default-features = false }
# External dependencies.
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
sqlx = { version = "0.8", default-features = false }
axum = "0.8"
utoipa = "5"
reqwest = { version = "0.12", default-features = false }
redis = { version = "0.27", default-features = false }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
arrow = "58.4.1"
parquet = { version = "58.4.1", default-features = false, features = ["arrow"] }
object_store = "0.11"

[workspace.lints.clippy]
# Use Result instead of panic or unwrap in domain code.
unwrap_used = "warn"
