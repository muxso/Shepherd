name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支新推送取消旧运行,省 CI 时间。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 与本地一致(home 0.5.11 适配 rustc 1.86;Cargo.lock 已 pin)。升级 rustc 时一并调整。
  RUST_TOOLCHAIN: "1.86.0"

jobs:
  # —— 质量门:production(lib+bin)clippy 零告警 + 全量构建 ——
  check:
    name: clippy + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      # 仅 lib+bin(production)零告警:domain 的 unwrap 等已被 workspace lint 约束。
      - name: clippy (production, deny warnings)
        run: cargo clippy --workspace --locked -- -D warnings
      # 测试目标也必须编译零告警(unwrap 在测试里放行):防"lib 编译过但测试夹具漏改"。
      - name: clippy (all targets)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -A clippy::unwrap-used
      - name: build
        run: cargo build --workspace --locked

  # —— 供应链:依赖漏洞扫描(RustSec 通告库)——
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  # —— 前端构建门:类型检查 + 产物构建,防 web/ 腐化 ——
  web:
    name: web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm ci
      # tsc -b(严格类型)+ vite build,任一失败即挡板。
      - name: build
        run: npm run build

  # —— 单元 + 自包含集成(不需外部服务;含架构守卫)——
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      # --all-features:覆盖各上下文全部适配器 + 协议插件 + 架构守卫;不跑 #[ignore]。
      - name: cargo test
        run: cargo test --workspace --all-features --locked

  # —— gated 集成:需真 PostgreSQL / Redis / MySQL ——
  integration:
    name: integration (pg/redis/mysql)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: msuser
          POSTGRES_PASSWORD: mspass
          POSTGRES_DB: mstest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U msuser -d mstest"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mspass
          MYSQL_DATABASE: mstest
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmspass"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://msuser:mspass@localhost:5432/mstest
      REDIS_URL: redis://localhost:6379/0
      MYSQL_URL: mysql://root:mspass@localhost:3306/mstest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      # 跨上下文端到端(真 server + 真库):auth/RBAC、需求→拆分→交付→验证、
      # LLM agent(mock LLM)、自纠正、并行 DAG、MCP、api-definition→run…
      - name: server scenarios
        run: cargo test -p server --test scenarios --locked -- --ignored --test-threads=1
      - name: runner protocol routing (pg)
        run: cargo test -p runner --features pg --test pg_protocol --locked -- --ignored --test-threads=1
      - name: test-plan pg aggregate
        run: cargo test -p test-plan --features pg --lib --locked -- --ignored --test-threads=1
      - name: probe redis live
        run: cargo test -p probe --features redis --test redis_live --locked -- --ignored --test-threads=1
      # mysql:8 就绪/认证偶有抖动,先设非阻断(本地未跑过);稳定后可改为必过。
      - name: probe mysql live
        continue-on-error: true
        run: cargo test -p probe --features mysql --test mysql_live --locked -- --ignored --test-threads=1
      # 全量 API 自测:脚本起 server + 编排打 ~80 个端点 + 断状态码(资源链)。需先有 server 二进制。
      - name: build server binary
        run: cargo build -p server --locked
      - name: full API self-test (scripts/api-coverage.sh)
        run: bash scripts/api-coverage.sh
