name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep CI aligned with the workspace MSRV declared in Cargo.toml.
  RUST_TOOLCHAIN: "1.88.0"

jobs:
  # Production lint and build checks.
  check:
    name: clippy + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      # Production code must pass Clippy without warnings.
      - name: clippy (production, deny warnings)
        run: cargo clippy --workspace --locked -- -D warnings
      # Check test targets too; allow unwrap in tests.
      - name: clippy (all targets)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -A clippy::unwrap-used
      - name: build
        run: cargo build --workspace --locked
      # Reject rustdoc warnings, including broken links.
      - name: doc
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # Audit dependencies against RustSec.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  # Check documentation links and language pairs.
  docs:
    name: docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: check doc links
        run: python3 scripts/docs-link-check.py --report
      # Retain the report on success and failure.
      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-link-check-report
          path: docs/link-check-report.md

  # Frontend type checks and production build.
  web:
    name: web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm ci
      # Require both TypeScript and Vite to pass.
      - name: build
        run: npm run build
      - name: install browser for plugin UI checks
        run: npx playwright install --with-deps chromium
      - name: Yunxiao read-only collector contracts
        working-directory: .
        run: python3 -m unittest discover -s plugins/yunxiao/scripts -p 'test_*.py'
      - name: environment plugin UI contracts
        run: npx playwright test environment-plugins.spec.ts plugins.spec.ts project-switch.spec.ts productivity.spec.ts requirement-output.spec.ts member-metrics.spec.ts rich-text.spec.ts rag-code.spec.ts code-authors.spec.ts reference-graph.spec.ts
        env:
          E2E_START_VITE: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rag-code-ui
          path: web/test-results/**/rag-*.png
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-author-ui
          path: web/test-results/**/code-authors-*.png
          if-no-files-found: ignore
          retention-days: 7

  # Unit and self-contained integration tests, including architecture checks.
  test:
    name: unit tests
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: unit-no-debug-v1
      # Cover all adapters and protocol plugins; ignored tests run separately.
      - name: cargo test
        run: cargo test --workspace --all-features --locked

  # Integration tests against PostgreSQL, Redis, and MySQL.
  integration:
    name: integration (pg/redis/mysql)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: msuser
          POSTGRES_PASSWORD: mspass
          POSTGRES_DB: mstest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U msuser -d mstest"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mspass
          MYSQL_DATABASE: mstest
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmspass"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      DATABASE_URL: postgres://msuser:mspass@localhost:5432/mstest
      REDIS_URL: redis://localhost:6379/0
      MYSQL_URL: mysql://root:mspass@localhost:3306/mstest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: integration-no-debug-v1
      # Cross-context tests with a real server and database:
      # RBAC, delivery, agent workflows, DAGs, MCP, and API execution.
      - name: server scenarios
        run: cargo test -p server --test scenarios --locked -- --ignored --test-threads=1
      - name: environment plugin storage and credentials (isolated databases)
        env:
          PGPASSWORD: mspass
          ENVIRONMENT_PLUGIN_TEST_HOST_URL: postgres://msuser:mspass@localhost:5432/environment_plugin_host_test
          ENVIRONMENT_PLUGIN_TEST_DATABASE_URL: postgres://msuser:mspass@localhost:5432/environment_plugin_data_test
        run: |
          trap 'dropdb -h localhost -U msuser --if-exists --force environment_plugin_host_test; dropdb -h localhost -U msuser --if-exists --force environment_plugin_data_test' EXIT
          createdb -h localhost -U msuser environment_plugin_host_test
          createdb -h localhost -U msuser environment_plugin_data_test
          cargo test -p environment-plugins --all-features --test storage --locked -- --ignored --test-threads=1
          cargo test -p server --bin server environment_extension::tests::isolated_environment_plugin_api --locked -- --ignored --test-threads=1
          cargo test -p probe --no-default-features --features sql,mysql --test database_results --locked -- --ignored --test-threads=1
      - name: Yunxiao plugin statistics (isolated database)
        env:
          PGPASSWORD: mspass
          SHEPHERD_YUNXIAO_TEST_DATABASE_URL: postgres://msuser:mspass@localhost:5432/yunxiao_plugin_test
        run: |
          trap 'dropdb -h localhost -U msuser --if-exists --force yunxiao_plugin_test' EXIT
          createdb -h localhost -U msuser yunxiao_plugin_test
          cargo test -p shepherd-yunxiao --all-features --test pg_sync --locked -- --ignored --test-threads=1
      - name: project requirement coverage summary (isolated database)
        env:
          PGPASSWORD: mspass
          SHEPHERD_COVERAGE_TEST_DATABASE_URL: postgres://msuser:mspass@localhost:5432/coverage_summary_test
        run: |
          trap 'dropdb -h localhost -U msuser --if-exists --force coverage_summary_test' EXIT
          createdb -h localhost -U msuser coverage_summary_test
          cargo test -p case-management --all-features --test coverage_pg --locked -- --ignored
      - name: Git activity RAG audience and date contracts (isolated database)
        env:
          PGPASSWORD: mspass
          SHEPHERD_RAG_TEST_DATABASE_URL: postgres://msuser:mspass@localhost:5432/rag_activity_test
        run: |
          trap 'dropdb -h localhost -U msuser --if-exists --force rag_activity_test' EXIT
          createdb -h localhost -U msuser rag_activity_test
          cargo test -p rag --all-features --test activity_pg --locked -- --ignored --test-threads=1
      - name: runner protocol routing (pg)
        run: cargo test -p runner --features pg --test pg_protocol --locked -- --ignored --test-threads=1
      - name: test-plan pg aggregate
        run: cargo test -p test-plan --features pg --lib --locked -- --ignored --test-threads=1
      - name: SSH profiles and pinned transport
        run: |
          cargo test -p probe --no-default-features --features ssh --test ssh_commands --locked -- --ignored --test-threads=1
          cargo test -p environment-plugins --all-features --test ssh_provider --locked -- --ignored --test-threads=1
      - name: probe redis live
        run: |
          cargo test -p probe --features redis --test redis_live --locked -- --ignored --test-threads=1
          cargo test -p probe --no-default-features --features redis --test redis_commands --locked -- --ignored --test-threads=1
      # MySQL readiness and authentication can be flaky; keep this check non-blocking.
      - name: probe mysql live
        continue-on-error: true
        run: cargo test -p probe --features mysql --test mysql_live --locked -- --ignored --test-threads=1
      # Start the built server and verify API workflows and status codes.
      - name: build server binary
        run: cargo build -p server --locked
      - name: full API self-test (scripts/api-coverage.sh)
        run: bash scripts/api-coverage.sh
      # Check frontend API paths against OpenAPI; baseline existing gaps.
      - name: web/API contract drift (scripts/ts-drift.sh)
        run: |
          SHEPHERD_BIND=127.0.0.1:9280 ./target/debug/server & SRV=$!
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:9280/healthz >/dev/null && break; sleep 1; done
          BASE=http://127.0.0.1:9280 bash scripts/ts-drift.sh
          kill $SRV
