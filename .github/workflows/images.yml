# Build & push the three Shepherd container images to GHCR.
#
# Images (one per matrix component, built from deploy/docker/Dockerfile.<component>):
#   - ghcr.io/<owner>/shepherd-server
#   - ghcr.io/<owner>/shepherd-agent-runtime
#   - ghcr.io/<owner>/shepherd-web
#
# Triggers:
#   - push of a git tag matching v*  → tags: semver + latest-off, plus sha
#   - the CI workflow completing successfully on main  → tags: main + latest + sha
#     (this is the "publish images once main passes" path)
#   - manual workflow_dispatch
# Auth: GHCR via the built-in GITHUB_TOKEN (no extra secrets required).
name: images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  # Publish images automatically once the CI workflow goes green on main, so we
  # only ship artifacts that have passed the quality gate (ci.yml).
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: images-${{ github.ref }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: build & push ${{ matrix.component }}
    # When triggered by workflow_run, only build if CI concluded successfully.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [server, agent-runtime, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Under workflow_run, check out the exact commit CI tested, so we ship
        # the version that actually passed.
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/shepherd-${{ matrix.component }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            # Rolling images published after CI passes on main are tagged
            # `main` so the deploy job can pull them by default.
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
